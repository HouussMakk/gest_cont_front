<div class="sidebar flex-shrink-0 p-3">
  <br>
  <div class="d-flex justify-content-center align-items-center pb-3 mb-3 border-bottom">
    <img src="/assets/images/logo.png" alt="Logo" width="105">
    <span class="app-title"></span>
  </div>

  <div class="menu-container">
    <div class="menu-header text-center mb-3">MAIN MENU</div>

    <ul class="list-unstyled ps-0">
      <li *ngFor="let item of menuItems" class="mb-1">
        <!-- Menu item sans sous-menu -->
        <div *ngIf="!hasSubmenu(item)"
             class="menu-item d-inline-flex align-items-center rounded text-decoration-none p-2 w-100"
             [routerLink]="item.route"
             routerLinkActive="active">
          <i [ngClass]="item.icon" class="me-2"></i>
          <span>{{ item.title }}</span>
        </div>

        <!-- Menu item avec sous-menu -->
        <div *ngIf="hasSubmenu(item)">
          <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 p-2 w-100 text-start"
                  [class.collapsed]="!item.expanded"
                  (click)="toggleSubmenu(item)"
                  [attr.aria-expanded]="item.expanded">
            <i [ngClass]="item.icon" class="me-2"></i>
            <span>{{ item.title }}</span>
            <i class="bi bi-chevron-down ms-auto expand-icon"
               [class.rotated]="item.expanded"></i>
          </button>

          <!-- Sous-menu -->
          <div class="collapse" [class.show]="item.expanded">
            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small ps-3">
              <li *ngFor="let subItem of item.submenu">
                <a [routerLink]="subItem.route"
                   routerLinkActive="active"
                   class="submenu-link d-inline-flex align-items-center text-decoration-none rounded p-2 w-100">
                  <i [ngClass]="subItem.icon" class="me-2"></i>
                  <span>{{ subItem.title }}</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </li>
    </ul>

    <!-- Logout Button -->
    <div class="logout-container mt-auto pt-3">
      <button
        class="logout-btn d-flex align-items-center justify-content-center w-100 p-3 rounded border-0"
        (click)="logout()"
        type="button">
        <i class="bi bi-box-arrow-right me-2"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </div>
</div>
