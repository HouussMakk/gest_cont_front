<div class="port-form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? 'Modifier le port' : 'Créer un nouveau port' }}</h2>
    <button class="btn-back" (click)="cancel()">
      <i class="material-icons">arrow_back</i>
      Retour
    </button>
  </div>

  <div *ngIf="loading" class="loading-indicator">
    <p>Chargement des données...</p>
  </div>

  <form [formGroup]="portForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="form-grid">
      <div class="form-group">
        <label for="codePort">Code Port *</label>
        <input
          type="text"
          id="codePort"
          formControlName="codePort"
          [class.is-invalid]="isFieldInvalid('codePort')"
          [placeholder]="isEditMode ? 'Code du port (non modifiable)' : 'Entrez le code du port'"
          [readonly]="isEditMode"
        >
        <div class="error-message" *ngIf="isFieldInvalid('codePort')">
          {{ getErrorMessage('codePort') }}
        </div>
      </div>

      <div class="form-group">
        <label for="nomPort">Nom du Port *</label>
        <input
          type="text"
          id="nomPort"
          formControlName="nomPort"
          [class.is-invalid]="isFieldInvalid('nomPort')"
          placeholder="Entrez le nom du port"
        >
        <div class="error-message" *ngIf="isFieldInvalid('nomPort')">
          {{ getErrorMessage('nomPort') }}
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
      <button type="submit" class="btn-submit" [disabled]="submitting || portForm.invalid">
        <span *ngIf="!submitting">{{ isEditMode ? 'Enregistrer les modifications' : 'Créer le port' }}</span>
        <span *ngIf="submitting">Traitement en cours...</span>
      </button>
    </div>
  </form>
</div>
