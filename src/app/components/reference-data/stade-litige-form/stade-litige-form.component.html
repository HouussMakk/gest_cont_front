<div class="stade-litige-form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? 'Modifier le stade litige' : 'Créer un nouveau stade litige' }}</h2>
    <button class="btn-back" (click)="cancel()">
      <i class="material-icons">arrow_back</i>
      Retour
    </button>
  </div>

  <div *ngIf="loading" class="loading-indicator">
    <p>Chargement des données...</p>
  </div>

  <form [formGroup]="stadeLitigeForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
    <div class="form-grid">
      <div class="form-group">
        <label for="stedelitige">Stade Litige *</label>
        <input
          type="text"
          id="stedelitige"
          formControlName="stedelitige"
          [class.is-invalid]="isFieldInvalid('stedelitige')"
          placeholder="Entrez le stade du litige"
        >
        <div class="error-message" *ngIf="isFieldInvalid('stedelitige')">
          {{ getErrorMessage('stedelitige') }}
        </div>
      </div>

      <div class="form-group">
        <label for="datChangementStatut">Date Changement Statut *</label>
        <input
          type="date"
          id="datChangementStatut"
          formControlName="datChangementStatut"
          [class.is-invalid]="isFieldInvalid('datChangementStatut')"
        >
        <div class="error-message" *ngIf="isFieldInvalid('datChangementStatut')">
          {{ getErrorMessage('datChangementStatut') }}
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
      <button type="submit" class="btn-submit" [disabled]="submitting || stadeLitigeForm.invalid">
        <span *ngIf="!submitting">{{ isEditMode ? 'Enregistrer les modifications' : 'Créer le stade litige' }}</span>
        <span *ngIf="submitting">Traitement en cours...</span>
      </button>
    </div>
  </form>
</div>
